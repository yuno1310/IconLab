name: harbor-evidence-lab
services:
  ollama:
    image: ollama/ollama:0.34.0
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama:/root/.ollama"]
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_local.py}
      POSTGRES_DB: langfuse
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
  langfuse:
    # Pinned legacy v2 for a small two-service local lab; not for production deployment.
    image: langfuse/langfuse:2.95.11
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${SALT}
      TELEMETRY_ENABLED: "false"
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: harbor-org
      LANGFUSE_INIT_ORG_NAME: Harbor Lab
      LANGFUSE_INIT_PROJECT_ID: harbor-project
      LANGFUSE_INIT_PROJECT_NAME: Evidence Lab
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: reviewer@harbor.invalid
      LANGFUSE_INIT_USER_NAME: Lab Reviewer
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_USER_PASSWORD}
volumes:
  ollama:
  postgres:
